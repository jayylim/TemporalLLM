services:
  # Command server (submission) - starts first and stays running
  # Container build from submission folder
  submission:
    build:
      context: ${SUBMISSION_FOLDER:-./submission}
      dockerfile: Dockerfile
    container_name: submission_server
    volumes:
      - shared_pipes:/shared
    # Keep the container running and restart if it fails
    restart: unless-stopped
    # Add some debug output
    environment:
      - PYTHONUNBUFFERED=1
    # Health check to ensure the server is ready
    healthcheck:
      test: ["CMD", "test", "-p", "/shared/command_pipe", "-a", "-p", "/shared/response_pipe"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    networks:
      - isolated_network # no internet access

  # Agent controller - runs the test commands and then exits
  # Container build from agent folder
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent_controller
    volumes:
      - shared_pipes:/shared
      # Read only access to the submission folder
      - ${SUBMISSION_FOLDER:-./submission}/PROMPT.json:/app/PROMPT.json:ro
      - ${SUBMISSION_FOLDER:-./submission}/DESCRIPTION.md:/app/DESCRIPTION.md:ro
      - ${CONDITION_FILE_ABS:-./.condition.json}:/app/CONDITION.json:ro
      - ./cai_datasets:/app/cai_datasets:ro
    depends_on:
      # Wait for the submission container to be healthy
      submission:
        condition: service_healthy
    # Agent should exit after completing its work
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HUGGINGFACE_API_KEY=${HF_TOKEN}
      - HF_TOKEN=${HF_TOKEN}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-131072}
      - SKIP_OPENAI_EVALUATION=${SKIP_OPENAI_EVALUATION:-0}
    # Agent has access to both networks for communication
    networks:
      - default
      - isolated_network

volumes:
  # Shared volume for named pipes communication
  shared_pipes:
    driver: local

networks:
  # Internal network with no external internet access
  isolated_network:
    driver: bridge
    internal: true
