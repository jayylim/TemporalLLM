# Central config for the Waiting Game intertemporal-choice pipeline.
# All scripts read from this file so grids/models/N stay consistent everywhere.

ollama:
  base_url: "http://localhost:11434"
  keep_alive: "5m"        # how long Ollama keeps a model resident after last request
  request_timeout_s: 120   # CoT completions take longer than the 5-token direct-answer mode
  max_retries: 3
  retry_backoff_s: 2       # exponential backoff base: sleep = retry_backoff_s * (2 ** attempt)

models:
  - qwen2.5:7b-instruct-fp16             # Qwen2.5-7B-Instruct (F16; default :7b-instruct tag is Q4_K_M)
  - qwen3:4b-instruct-2507-fp16          # Qwen3-4B-Instruct-2507 (F16)
  - qwen3:8b-fp16                        # Qwen3-8B (F16; default :8b tag is Q4_K_M)
  - qwen3:32b-fp16                       # Qwen3-32B (F16; default :32b tag is Q4_K_M)
  - qwen3.5:9b-mlx-bf16                  # Qwen3.5-9B Apple MLX BF16 (instruct via think:false — no separate instruct tag)
  - qwen3.5:27b-bf16                     # Qwen3.5-27B (F16; instruct via think:false)
  - qwen3.5:35b-a3b-bf16                 # Qwen3.5-35B-A3B MoE (F16; instruct via think:false)
  - llama3.1:8b-instruct-fp16            # Meta Llama-3.1-8B-Instruct (F16)
  - mistral:7b-instruct-fp16             # Mistral-7B-Instruct-v0.1 (F16; matches prior unversioned instruct line)

waiting_game:
  later_amount_dollars: 1000                       # fixed "later" payoff, matches Rachlin 1991 design
  # 6 delays from 1 month to 10 years (log-ish spaced).
  delay_grid_months: [1, 3, 6, 12, 36, 120]
  # 6 sooner amounts strictly between $0 and $1000 (exclusive).
  amount_grid_dollars: [100, 250, 400, 550, 700, 900]
  # $0 is not in the fit grid above; still collect it per delay so money-preference
  # competence remains evaluable. Probe trials are flagged is_competence_probe=True
  # and excluded from hyperbolic fitting.
  competence_probe_amounts: [0]
  n_samples_per_cell: 50                            # completions per (delay, amount) cell per model
  temperature: 1.0
  num_predict: 5                                    # short completion budget (only need "A"/"B")
  system_prompt: >-
    You are playing a game where you are given two monetary options. One is available sooner, and one is available later. You must
    choose one. When answering, respond with only the letter of the option
    you choose (A or B). Do not explain your choice.
  random_seed: 20260820                             # seeds order randomization for reproducibility

  # --- Chain-of-thought (CoT) reasoning mode ---
  # Same trial grid/prompts as above, but the system prompt now requires the
  # model to reason step by step before committing to a final letter. Used
  # via `--mode cot` on run_experiment.py / parse_responses.py / etc., so the
  # direct-answer data collected above is never overwritten.
  cot_system_prompt: >-
    You are playing a game where you are given two monetary options. You must
    choose one. Think step by step: compare the two amounts and how long you
    would have to wait for each, and reason about which is the better deal.
    After your reasoning, end your response with a final line, formatted
    exactly as "FINAL ANSWER: A" or "FINAL ANSWER: B", with no other text on
    that line.
  cot_num_predict: 100                              # reasoning needs far more tokens than the 5-token direct mode (changed from 300 to 100)

# --- Behavioral persona (toggleable) ---
# When enabled (--persona), the full trial grid is run once under each persona
# below. Persona-off (--no-persona) is the control. discounting_group is for
# results recording only and is never shown to the model.
persona:
  enabled: false
  prompt_template: |
    {persona_text}
    Answer the following questions and task as this person would most likely sincerely believe and do, not what is safest, most neutral, or most socially acceptable.
  personas:
    # --- Greater discounting (hypothesised) ---
    - id: substance_use
      label: Substance use
      discounting_group: greater
      text: >-
        You regularly buy and use drugs and alcohol, and it has been very
        difficult to quit.
    - id: sugary_food
      label: Sugary food
      discounting_group: greater
      text: >-
        You frequently buy sugary snacks and desserts throughout the day,
        including between meals.
    - id: phone_social_media
      label: Phone and social media
      discounting_group: greater
      text: >-
        You spend several hours each day using your phone and social media,
        and frequently check your phone throughout the day.
    - id: retail_spending
      label: Retail spending
      discounting_group: greater
      text: >-
        You frequently buy things that catch your attention while shopping
        and buy more than you had originally planned.
    # --- Lesser discounting (hypothesised) ---
    - id: mindfulness
      label: Mindfulness
      discounting_group: lesser
      text: >-
        You regularly practice mindfulness and meditation as part of your
        routine.
    - id: no_smoking_drinking
      label: No smoking or drinking
      discounting_group: lesser
      text: >-
        You do not smoke or drink alcohol and have maintained this lifestyle
        for many years.
    - id: strategy_games
      label: Strategy games
      discounting_group: lesser
      text: >-
        You regularly play strategy games and tend to carefully consider
        your moves before making them.
    - id: exercise
      label: Exercise
      discounting_group: lesser
      text: >-
        You exercise regularly and track your progress after every workout.

competence_checks:
  monotonicity_tolerance: 0.0        # allowed drop in P(sooner) between adjacent amounts before counting as a violation
  max_violations_per_delay: 1        # violations tolerated per delay row before that delay fails monotonicity
  max_p_sooner_at_zero_amount: 0.5   # model fails money-preference check if P(choose $0 now) exceeds this at any delay
  # Empirical 50% immediate equivalents x*(d) must be non-increasing in delay
  # (longer waits -> lower immediate value of $later). Allowed rise per adjacent
  # delay step before counting a violation:
  indifference_nonincreasing_tolerance: 0.0
  max_indifference_violations: 0     # number of adjacent delay rises tolerated before failing

fitting:
  n_bootstrap: 1000
  bootstrap_seed: 42
  # Two-step hyperbolic fit (Rachlin-style):
  #   1) per delay, interpolate the sooner amount at which P(choose sooner)=0.5
  #   2) nonlinear least-squares of x(d) = later_amount / (1 + k*d) to those
  #      empirical immediate equivalents.
  # Reasonable k bounds (per month). Fits landing at either bound are cut as
  # unreliable (k_at_boundary / k_is_reliable) but the bound values themselves
  # are still reported. min_r_squared / min_n_indifference_points gate fit quality.
  k_lower_bound: 0.000001
  k_upper_bound: 10.0
  min_r_squared: 0.5
  min_n_indifference_points: 3

human_benchmark:
  rachlin_1991_k_per_month: 0.01     # approximate hyperbolic k reported in Rachlin et al. (1991), for reference overlay only

visualization:
  n_sample_trials_to_plot_per_cell: 10   # how many raw individual trials to overlay as jittered dots per (delay, amount) cell
  trial_selection_seed: 123

paths:
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  results_tables_dir: "results/tables"
  results_figures_dir: "results/figures"
  results_summary_dir: "results/summary"   # clean cross-factor tables (model x trial_type x persona)
