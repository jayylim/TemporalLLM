#
# All 27 rows cross-checked between both sources (item#, SIR/LDR/delay match
# exactly; magnitude bands align: Small LDR $25-35, Medium LDR $50-60, Large
# LDR $75-85; k formula k = (ldr - sir) / (sir * delay_days) reproduces the
# cited k to 4+ significant figures for every row).
#
# item_id: original 1-27 numbering from the Kirby et al. (1999) instrument.
# sir_amount_dollars / ldr_amount_dollars: smaller-immediate / larger-delayed reward.
# delay_days: delay until the LDR is paid.
# k_at_indifference: the discount rate at which SIR == LDR / (1 + k*delay) (per-day units).
# magnitude: small / medium / large LDR magnitude band (used for the
#   small_k/medium_k/large_k scoring and the magnitude-effect check).
